<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket de Venta</title>
    <style>
        body {
            background-color: #e2e8f0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 5px;
        }
        .ticket {
            background: #ffffff;
            width: 100%;
            max-width: 300px;
            padding: 10px 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            border-radius: 4px;
            color: #000000;
            box-sizing: border-box;
            font-size: 14px; /* Letras más legibles y grandes */
        }
        .text-center { text-align: center; }
        .text-right { text-align: right; }
        h2, h3, p { margin: 4px 0; }
        .store-logo { max-width: 130px; max-height: 70px; margin-bottom: 5px; object-fit: contain; }
        .store-name { font-size: 18px; font-weight: bold; } /* Nombre del negocio más destacado */
        .store-info { font-size: 13px; display: none; }
        .ticket-info, .totals, .footer { font-size: 13px; margin-bottom: 8px; }
        .divider { border-top: 1px dashed #000000; margin: 8px 0; }
        .items-table { width: 100%; border-collapse: collapse; font-size: 14px; } /* Texto de los tacos más grande */
        .items-table th { border-bottom: 1px solid #000000; text-align: left; padding-bottom: 4px; }
        .items-table td { padding: 5px 0; vertical-align: top; white-space: pre-wrap; }
        .total-row { font-weight: bold; font-size: 16px; } /* Total más grande */
        .status-badge { font-weight: bold; text-align: center; margin: 8px 0; padding: 5px; border: 1px dashed #000; font-size: 12px; }

        /* CONFIGURACIÓN EXCLUSIVA PARA LA IMPRESORA TÉRMICA */
        @media print {
            @page {
                size: 80mm auto; /* Ajusta el ancho a papel térmico estándar de 80mm */
                margin: 0;       /* Elimina márgenes de hoja carta */
            }
            body {
                background-color: #ffffff;
                display: block;
                padding: 0;
                margin: 0;
            }
            .ticket {
                box-shadow: none;
                max-width: 100% !important;
                width: 100% !important;
                padding: 2mm;
                margin: 0;
            }
        }
    </style>
</head>
<body>

<div class="ticket">
  <div class="text-center">
    <!-- Contenedor del Logo -->
    <div id="divLogoContainer" style="display: none;">
        <img id="imgLogo" class="store-logo" src="" alt="Logo Negocio">
    </div>
    <div class="store-name" id="lblNegocio">SISTEMA DE VENTAS</div>
    <div style="font-size: 12px;">Comanda / Nota de Consumo</div>
    <div class="store-info" id="lblTelefono"></div>
    <div class="store-info" id="lblDomicilio"></div>
    <div style="font-size: 11px; margin-top: 4px;">--------------------------------</div>
  </div>

  <div class="ticket-info" style="margin-top: 6px;">
    <div><strong>Mesa/Etiqueta:</strong> <span id="lblEtiqueta">--</span></div>
    <div><strong>Fecha:</strong> <span id="lblFecha">--</span></div>
  </div>

  <div id="divEstatus" class="status-badge">ESTADO: PENDIENTE</div>

  <div class="divider"></div>

  <table class="items-table">
    <thead>
      <tr>
        <th>DESCRIPCIÓN / CONSUMO</th>
      </tr>
    </thead>
    <tbody id="tablaItems">
    </tbody>
  </table>

  <div class="divider"></div>

  <table class="items-table">
    <tr class="total-row">
      <td>TOTAL A PAGAR:</td>
      <td class="text-right" id="lblTotal">$0.00</td>
    </tr>
  </table>

  <div class="divider"></div>

  <div class="text-center footer" style="font-size: 12px;">
    <p>¡Gracias por su preferencia!</p>
    <p>Conserve este ticket</p>
  </div>
</div>

<script>
    function obtenerParametro(nombre) {
        let url = window.location.href;
        let regex = new RegExp('[?&]' + nombre + '=([^&#]*)', 'i');
        let resultado = regex.exec(url);
        return resultado ? decodeURIComponent(resultado[1].replace(/\+/g, ' ')) : '';
    }

    let negocio = obtenerParametro('negocio');
    let telefono = obtenerParametro('telefono');
    let domicilio = obtenerParametro('domicilio');
    let etiqueta = obtenerParametro('etiqueta');
    let fecha = obtenerParametro('fecha');
    let total = obtenerParametro('total');
    let estatus = obtenerParametro('estatus');
    let itemsParam = obtenerParametro('items');
    let logoUrl = obtenerParametro('logo');

    if (logoUrl && logoUrl.trim() !== '') {
        let img = document.getElementById('imgLogo');
        img.src = logoUrl;
        document.getElementById('divLogoContainer').style.display = 'block';
    }

    document.getElementById('lblNegocio').innerText = negocio || 'SISTEMA DE VENTAS';
    
    if(telefono) {
        let elTel = document.getElementById('lblTelefono');
        elTel.innerText = 'Tel: ' + telefono;
        elTel.style.display = 'block';
    }
    
    if(domicilio) {
        let elDom = document.getElementById('lblDomicilio');
        elDom.innerText = domicilio;
        elDom.style.display = 'block';
    }

    document.getElementById('lblEtiqueta').innerText = etiqueta || 'MOSTRADOR';
    document.getElementById('lblFecha').innerText = fecha || '--';
    document.getElementById('lblTotal').innerText = '$' + (total || '0.00');
    document.getElementById('divEstatus').innerText = 'ESTADO: ' + (estatus ? estatus.toUpperCase() : 'PENDIENTE');

    let tbody = document.getElementById('tablaItems');
    tbody.innerHTML = '';

    if (itemsParam) {
        let listaItems = itemsParam.split('|');
        listaItems.forEach(item => {
            let textoLimpio = item.trim();
            if (textoLimpio !== '') {
                let textoSinAsterisco = textoLimpio.split('*').join(' ');
                
                let partes = textoSinAsterisco.trim().split(' ');
                let ultimoElemento = partes[partes.length - 1];
                
                let textoFinal = textoSinAsterisco;
                if (!isNaN(ultimoElemento) && ultimoElemento !== '') {
                    partes[partes.length - 1] = '$' + ultimoElemento;
                    textoFinal = partes.join(' ');
                }

                let tr = document.createElement('tr');
                let td = document.createElement('td');
                td.innerText = textoFinal;
                tr.appendChild(td);
                tbody.appendChild(tr);
            }
        });
    } else {
        let tr = document.createElement('tr');
        let td = document.createElement('td');
        td.innerText = "Sin items registrados";
        tr.appendChild(td);
        tbody.appendChild(tr);
    }

    window.onload = function() {
        setTimeout(function() {
            window.print();
        }, 500);
    };
</script>

</body>
</html>
