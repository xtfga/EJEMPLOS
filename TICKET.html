<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket de Venta</title>
    <style>
        body {
            background-color: #e2e8f0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
        }
        .ticket {
            background: #ffffff;
            width: 100%;
            max-width: 320px;
            padding: 20px 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            border-radius: 4px;
            color: #000000;
            box-sizing: border-box;
        }
        .text-center { text-align: center; }
        .text-right { text-align: right; }
        h2, h3, p { margin: 4px 0; }
        .store-name { font-size: 16px; font-weight: bold; }
        .store-info { font-size: 11px; display: none; }
        .ticket-info, .totals, .footer { font-size: 12px; margin-bottom: 10px; }
        .divider { border-top: 1px dashed #000000; margin: 10px 0; }
        .items-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .items-table th { border-bottom: 1px solid #000000; text-align: left; padding-bottom: 4px; }
        .items-table td { padding: 4px 0; vertical-align: top; white-space: pre-wrap; }
        .total-row { font-weight: bold; font-size: 14px; }
        .status-badge { font-weight: bold; text-align: center; margin: 10px 0; padding: 4px; border: 1px dashed #000; font-size: 11px; }
    </style>
</head>
<body>

<div class="ticket">
  <div class="text-center">
    <div class="store-name" id="lblNegocio">SISTEMA DE VENTAS</div>
    <div style="font-size: 11px;">Comanda / Nota de Consumo</div>
    <div class="store-info" id="lblTelefono"></div>
    <div class="store-info" id="lblDomicilio"></div>
    <div style="font-size: 10px; margin-top: 4px;">--------------------------------</div>
  </div>

  <div class="ticket-info" style="margin-top: 8px;">
    <div><strong>Mesa/Etiqueta:</strong> <span id="lblEtiqueta">--</span></div>
    <div><strong>Fecha:</strong> <span id="lblFecha">--</span></div>
  </div>

  <div id="divEstatus" class="status-badge">ESTADO: PENDIENTE</div>

  <div class="divider"></div>

  <table class="items-table">
    <thead>
      <tr>
        <th>DESCRIPCIÓN / CONSUMO</th>
      </tr>
    </thead>
    <tbody id="tablaItems">
    </tbody>
  </table>

  <div class="divider"></div>

  <table class="items-table">
    <tr class="total-row">
      <td>TOTAL A PAGAR:</td>
      <td class="text-right" id="lblTotal">$0.00</td>
    </tr>
  </table>

  <div class="divider"></div>

  <div class="text-center footer" style="font-size: 11px;">
    <p>¡Gracias por su preferencia!</p>
    <p>Conserve este ticket</p>
  </div>
</div>

<script>
    function obtenerParametro(nombre) {
        let url = window.location.href;
        let regex = new RegExp('[?&]' + nombre + '=([^&#]*)', 'i');
        let resultado = regex.exec(url);
        return resultado ? decodeURIComponent(resultado[1].replace(/\+/g, ' ')) : '';
    }

    let negocio = obtenerParametro('negocio');
    let telefono = obtenerParametro('telefono');
    let domicilio = obtenerParametro('domicilio');
    let etiqueta = obtenerParametro('etiqueta');
    let fecha = obtenerParametro('fecha');
    let total = obtenerParametro('total');
    let estatus = obtenerParametro('estatus');
    let itemsParam = obtenerParametro('items');

    document.getElementById('lblNegocio').innerText = negocio || 'SISTEMA DE VENTAS';
    
    if(telefono) {
        let elTel = document.getElementById('lblTelefono');
        elTel.innerText = 'Tel: ' + telefono;
        elTel.style.display = 'block';
    }
    
    if(domicilio) {
        let elDom = document.getElementById('lblDomicilio');
        elDom.innerText = domicilio;
        elDom.style.display = 'block';
    }

    document.getElementById('lblEtiqueta').innerText = etiqueta || 'MOSTRADOR';
    document.getElementById('lblFecha').innerText = fecha || '--';
    document.getElementById('lblTotal').innerText = '$' + (total || '0.00');
    document.getElementById('divEstatus').innerText = 'ESTADO: ' + (estatus ? estatus.toUpperCase() : 'PENDIENTE');

    let tbody = document.getElementById('tablaItems');
    tbody.innerHTML = '';

    if (itemsParam) {
        let listaItems = itemsParam.split('|');
        listaItems.forEach(item => {
            let textoLimpio = item.trim();
            if (textoLimpio !== '') {
                // Inserta automáticamente el signo de pesos antes del número final si no lo tiene
                // Ejemplo: transforma "1x Quesadilla de Bistec 25" en "1x Quesadilla de Bistec $25"
                let textoConPrecio = textoLimpio.replace(/(\s)(\d+)$/, '$1$$$2');

                let tr = document.createElement('tr');
                let td = document.createElement('td');
                td.innerText = textoConPrecio;
                tr.appendChild(td);
                tbody.appendChild(tr);
            }
        });
    } else {
        let tr = document.createElement('tr');
        let td = document.createElement('td');
        td.innerText = "Sin items registrados";
        tr.appendChild(td);
        tbody.appendChild(tr);
    }
</script>

</body>
</html>
