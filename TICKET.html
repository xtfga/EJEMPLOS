<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket de Venta</title>
    <style>
        body {
            background-color: #e2e8f0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
        }
        .ticket {
            background: #ffffff;
            width: 100%;
            max-width: 320px;
            padding: 20px 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            border-radius: 4px;
            color: #000000;
            box-sizing: border-box;
        }
        .text-center { text-align: center; }
        .text-right { text-align: right; }
        h2, h3, p { margin: 4px 0; }
        .logo-container { margin-bottom: 8px; display: none; }
        .logo-img { max-width: 80px; max-height: 80px; object-fit: contain; }
        .store-name { font-size: 16px; font-weight: bold; }
        .store-info { font-size: 11px; display: none; }
        .ticket-info, .totals, .footer { font-size: 12px; margin-bottom: 10px; }
        .divider { border-top: 1px dashed #000000; margin: 10px 0; }
        .items-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .items-table th { border-bottom: 1px solid #000000; text-align: left; padding-bottom: 4px; }
        .items-table td { padding: 4px 0; vertical-align: top; }
        .total-row { font-weight: bold; font-size: 14px; }
        .status-badge { font-weight: bold; text-align: center; margin: 10px 0; padding: 4px; border: 1px dashed #000; font-size: 11px; }
    </style>
</head>
<body>

<div class="ticket">
  <div class="text-center">
    <div class="logo-container" id="divLogoContainer">
      <img id="imgLogo" src="" alt="Logo" class="logo-img">
    </div>
    <div class="store-name" id="lblNegocio">SISTEMA DE VENTAS</div>
    <div style="font-size: 11px;" id="lblSubHeader">Comanda / Nota de Consumo</div>
    <div class="store-info" id="lblTelefono"></div>
    <div class="store-info" id="lblDomicilio"></div>
    <div style="font-size: 10px; margin-top: 4px;">--------------------------------</div>
  </div>

  <div class="ticket-info" style="margin-top: 8px;">
    <div><strong>Mesa/Etiqueta:</strong> <span id="lblEtiqueta">--</span></div>
    <div><strong>Fecha:</strong> <span id="lblFecha">--</span></div>
  </div>

  <div id="divEstatus" class="status-badge">ESTADO: PENDIENTE</div>

  <div class="divider"></div>

  <table class="items-table">
    <thead>
      <tr>
        <th>DESCRIPCIÓN</th>
        <th class="text-right">IMP.</th>
      </tr>
    </thead>
    <tbody id="tablaItems">
    </tbody>
  </table>

  <div class="divider"></div>

  <table class="items-table">
    <tr class="total-row">
      <td>TOTAL A PAGAR:</td>
      <td class="text-right" id="lblTotal">$0.00</td>
    </tr>
  </table>

  <div class="divider"></div>

  <div class="text-center footer" style="font-size: 11px;">
    <p>¡Gracias por su preferencia!</p>
    <p>Conserve este ticket</p>
  </div>
</div>

<script>
    const queryString = window.location.search;
    const params = new URLSearchParams(queryString);
    
    function getParam(name) {
        const val = params.get(name);
        return val ? decodeURIComponent(val) : '';
    }

    document.getElementById('lblNegocio').innerText = getParam('negocio') || 'SISTEMA DE VENTAS';
    
    const tel = getParam('telefono');
    if(tel) { document.getElementById('lblTelefono').innerText = 'Tel: ' + tel; document.getElementById('lblTelefono').style.display = 'block'; }
    
    const dom = getParam('domicilio');
    if(dom) { document.getElementById('lblDomicilio').innerText = dom; document.getElementById('lblDomicilio').style.display = 'block'; }

    document.getElementById('lblEtiqueta').innerText = getParam('etiqueta') || 'MOSTRADOR';
    document.getElementById('lblFecha').innerText = getParam('fecha') || '--';
    
    let totalVal = getParam('total').replace('$', '').trim();
    document.getElementById('lblTotal').innerText = '$' + (totalVal || '0.00');
    
    const estatus = getParam('estatus') || 'PENDIENTE';
    const badgeEstatus = document.getElementById('divEstatus');
    badgeEstatus.innerText = 'ESTADO: ' + estatus.toUpperCase();

    const itemsParam = getParam('items');
    const tbody = document.getElementById('tablaItems');

    if (itemsParam && itemsParam.trim() !== '') {
        let cadenaLimpia = itemsParam.replace(/,\s*(?=[0-9]+x)/gi, '');
        const listaItems = cadenaLimpia.split('|');

        listaItems.forEach(item => {
            if (!item.trim()) return;
            let tr = document.createElement('tr');
            let tdProd = document.createElement('td');
            let tdPrecio = document.createElement('td');
            tdPrecio.className = 'text-right';

            // Separa el texto usando el asterisco (*)
            let partes = item.split('*');
            if (partes.length >= 2) {
                tdProd.innerText = partes[0].trim();
                tdPrecio.innerText = '$' + partes[1].trim(); // Pone el signo de pesos automáticamente de este lado
            } else {
                tdProd.innerText = item.trim();
                tdPrecio.innerText = '';
            }
            
            tr.appendChild(tdProd);
            tr.appendChild(tdPrecio);
            tbody.appendChild(tr);
        });
    } else {
        let tr = document.createElement('tr');
        let td = document.createElement('td');
        td.colSpan = 2;
        td.className = 'text-center';
        td.innerText = "Sin items registrados";
        tr.appendChild(td);
        tbody.appendChild(tr);
    }
</script>

</body>
</html>
