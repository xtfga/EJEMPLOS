<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket de Venta</title>
    <style>
        body {
            background-color: #e2e8f0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
        }
        .ticket {
            background: #ffffff;
            width: 100%;
            max-width: 320px;
            padding: 20px 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            border-radius: 4px;
            color: #000000;
            box-sizing: border-box;
        }
        .text-center { text-align: center; }
        .text-right { text-align: right; }
        h2, h3, p { margin: 4px 0; }
        .store-name { font-size: 16px; font-weight: bold; }
        .store-info { font-size: 11px; display: none; }
        .ticket-info, .totals, .footer { font-size: 12px; margin-bottom: 10px; }
        .divider { border-top: 1px dashed #000000; margin: 10px 0; }
        .items-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .items-table th { border-bottom: 1px solid #000000; text-align: left; padding-bottom: 4px; }
        .items-table td { padding: 4px 0; vertical-align: top; white-space: pre-wrap; }
        .total-row { font-weight: bold; font-size: 14px; }
        .status-badge { font-weight: bold; text-align: center; margin: 10px 0; padding: 4px; border: 1px dashed #000; font-size: 11px; }
    </style>
</head>
<body>

<div class="ticket">
  <div class="text-center">
    <div class="store-name" id="lblNegocio">SISTEMA DE VENTAS</div>
    <div style="font-size: 11px;">Comanda / Nota de Consumo</div>
    <div class="store-info" id="lblTelefono" style="display:block;"></div>
    <div class="store-info" id="lblDomicilio" style="display:block;"></div>
    <div style="font-size: 10px; margin-top: 4px;">--------------------------------</div>
  </div>

  <div class="ticket-info" style="margin-top: 8px;">
    <div><strong>Mesa/Etiqueta:</strong> <span id="lblEtiqueta">--</span></div>
    <div><strong>Fecha:</strong> <span id="lblFecha">--</span></div>
  </div>

  <div id="divEstatus" class="status-badge">ESTADO: PENDIENTE</div>

  <div class="divider"></div>

  <table class="items-table">
    <thead>
      <tr>
        <th>DESCRIPCIÓN / CONSUMO</th>
      </tr>
    </thead>
    <tbody id="tablaItems">
    </tbody>
  </table>

  <div class="divider"></div>

  <table class="items-table">
    <tr class="total-row">
      <td>TOTAL A PAGAR:</td>
      <td class="text-right" id="lblTotal">$0.00</td>
    </tr>
  </table>

  <div class="divider"></div>

  <div class="text-center footer" style="font-size: 11px;">
    <p>¡Gracias por su preferencia!</p>
    <p>Conserve este ticket</p>
  </div>
</div>

<script>
    // Extrae la URL completa de manera cruda y la decodifica por completo
    const urlCompleta = decodeURIComponent(window.location.href);

    // Función directa para sacar el valor de cualquier parámetro de la URL sin fallar
    function getParametroCrudo(nombre) {
        const regex = new RegExp('[?&]' + nombre + '=([^&#]*)');
        const resultados = regex.exec(urlCompleta);
        return resultados ? decodeURIComponent(resultados[1].replace(/\+/g, ' ')) : '';
    }

    // Rellenar datos generales
    document.getElementById('lblNegocio').innerText = getParametroCrudo('negocio') || 'SISTEMA DE VENTAS';
    
    const tel = getParametroCrudo('telefono');
    if(tel) document.getElementById('lblTelefono').innerText = 'Tel: ' + tel;
    
    const dom = getParametroCrudo('domicilio');
    if(dom) document.getElementById('lblDomicilio').innerText = dom;

    document.getElementById('lblEtiqueta').innerText = getParametroCrudo('etiqueta') || 'MOSTRADOR';
    document.getElementById('lblFecha').innerText = getParametroCrudo('fecha') || '--';
    document.getElementById('lblTotal').innerText = '$' + (getParametroCrudo('total') || '0.00');
    
    const estatus = getParametroCrudo('estatus') || 'PENDIENTE';
    document.getElementById('divEstatus').innerText = 'ESTADO: ' + estatus.toUpperCase();

    // Procesar la barra vertical y los items de forma directa
    const itemsParam = getParametroCrudo('items');
    const tbody = document.getElementById('tablaItems');

    if (itemsParam && itemsParam.trim() !== '') {
        // Divide usando la barra vertical real que viene en la URL
        let listaItems = itemsParam.split('|');

        listaItems.forEach(item => {
            let textoLimpio = item.trim();
            if (textoLimpio !== '') {
                let tr = document.createElement('tr');
                let td = document.createElement('td');
                
                // Muestra cada renglón respetando tus espacios
                td.innerText = textoLimpio;
                
                tr.appendChild(td);
                tbody.appendChild(tr);
            }
        });
    } else {
        let tr = document.createElement('tr');
        let td = document.createElement('td');
        td.innerText = "Sin items en la URL";
        tr.appendChild(td);
        tbody.appendChild(tr);
    }
</script>

</body>
</html>
